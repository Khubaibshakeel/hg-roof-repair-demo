# Concept demo hosting: the pages in site/ are already built, so there's nothing to run.
[build]
  publish = "site"
  command = ""

# Keep the demo out of search engines (the pages also carry noindex and robots.txt blocks crawlers)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Security headers (GitHub Pages can't send these; the pages also carry the content policy as a meta tag).
# frame-ancestors only works as a header: it stops other sites framing the pages (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'self'"

# The test tools are for this computer only
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true
